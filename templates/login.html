<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ — Bluror</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080c14;
            --surface: rgba(255,255,255,0.04);
            --surface-hover: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.08);
            --accent: #3b82f6;
            --accent-glow: rgba(59,130,246,0.35);
            --accent2: #06b6d4;
            --text: #f1f5f9;
            --text-muted: #64748b;
            --danger: #ef4444;
            --success: #22c55e;
            --radius: 16px;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Sarabun', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        /* Animated background blobs */
        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }
        .blob1 { width: 500px; height: 500px; background: #3b82f6; top: -150px; left: -150px; animation-delay: 0s; }
        .blob2 { width: 400px; height: 400px; background: #06b6d4; bottom: -100px; right: -100px; animation-delay: 3s; }
        .blob3 { width: 300px; height: 300px; background: #8b5cf6; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: 1.5s; }
        @keyframes float {
            0%,100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }
        .blob3 { animation: float2 10s ease-in-out infinite; }
        @keyframes float2 {
            0%,100% { transform: translate(-50%,-50%) scale(1); }
            50% { transform: translate(-50%,-55%) scale(1.08); }
        }
        /* Grid overlay */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .card {
            position: relative;
            background: rgba(10,15,25,0.7);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 44px;
            width: 440px;
            box-shadow: 0 0 60px rgba(59,130,246,0.1), 0 32px 64px rgba(0,0,0,0.5);
            animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .logo {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 32px; justify-content: center;
        }
        .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .logo-text {
            font-family: 'Syne', sans-serif;
            font-size: 22px; font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .logo-text span { color: var(--accent); }
        h3 {
            font-family: 'Syne', sans-serif;
            color: var(--text); font-size: 24px; font-weight: 700;
            margin-bottom: 8px; text-align: center;
        }
        .subtitle { color: var(--text-muted); font-size: 14px; text-align: center; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #94a3b8; font-size: 13px; font-weight: 500; margin-bottom: 8px; letter-spacing: 0.3px; }
        input[type=text], input[type=password] {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text);
            font-family: 'Sarabun', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        input:focus {
            border-color: var(--accent);
            background: rgba(59,130,246,0.07);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        input::placeholder { color: var(--text-muted); }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            border: none; border-radius: 12px;
            color: #fff; font-family: 'Sarabun', sans-serif;
            font-size: 16px; font-weight: 600;
            cursor: pointer; margin-top: 8px;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px var(--accent-glow);
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 8px 28px var(--accent-glow); }
        .btn-primary:active { transform: translateY(0); }
        .footer-link { text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 14px; }
        .footer-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .footer-link a:hover { text-decoration: underline; }
        .alert-danger {
            background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px; padding: 12px 16px; color: #fca5a5;
            font-size: 14px; margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="bg-blob blob1"></div>
    <div class="bg-blob blob2"></div>
    <div class="bg-blob blob3"></div>

    <div class="card">
        <div class="logo">
            <div class="logo-icon">🛡️</div>
            <div class="logo-text">Blu<span>ror</span></div>
        </div>
        <h3>เข้าสู่ระบบ</h3>
        <p class="subtitle">ปกป้องความเป็นส่วนตัวด้วย AI</p>

        {% if error %}<div class="alert-danger">⚠️ {{ error }}</div>{% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label>ชื่อผู้ใช้งาน</label>
                <input type="text" name="username" placeholder="กรอก username" required>
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <input type="password" name="password" placeholder="กรอก password" required>
            </div>
            <button type="submit" class="btn-primary">เข้าสู่ระบบ →</button>
        </form>
        <div class="footer-link">
            ยังไม่มีบัญชี? <a href="/register">สมัครสมาชิกที่นี่</a>
        </div>
    </div>
</body>
</html>
